services:
  backupzcrypt-worker:
    build:
      context: .
      dockerfile: BackupZCrypt.Worker/Dockerfile
    environment:
      - BACKUP_PASSWORD=change-this-password # Password used for encryption and decryption
      - BACKUP_ENCRYPTION_ALGORITHM=Aes # Encryption algorithm: None, Aes, Twofish, Serpent, ChaCha20, Camellia (default: Aes)
      - BACKUP_KEY_DERIVATION_ALGORITHM=Argon2id # Key derivation algorithm: Argon2id, PBKDF2, Scrypt (default: Argon2id)
      - BACKUP_COMPRESSION=Zstd # Compression mode: None, ZstdFast, Zstd, ZstdBest (default: None)
      - BACKUP_DELETE_SOURCE_FILES=false # Delete source files after successful operation (default: false)
    volumes:
      - ./example/backup-source:/data/backup-source # Files/directories to back up
      - ./example/backup-destination:/data/backup-destination # Where encrypted backups are written
      - ./example/restore-source:/data/restore-source # Encrypted backups to restore
      - ./example/restore-destination:/data/restore-destination # Where restored files are written
