name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    needs: quality
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

  release:
    needs: codeql
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

  quality:
    name: Build, test and quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies and tools
        run: |
          dotnet restore BackupZCrypt.sln
          dotnet tool restore
      - name: Build application
        run: dotnet build BackupZCrypt.sln --configuration Release --no-restore
      - name: Tests with core coverage
        run: >-
          dotnet test BackupZCrypt.Test/BackupZCrypt.Test.csproj
          --configuration Release --no-build --no-restore
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --coverage-settings BackupZCrypt.Test/CodeCoverage.config
          --results-directory TestResults/coverage
      - name: Report and enforce core coverage >= 90%
        run: |
          dotnet reportgenerator "-reports:TestResults/coverage/*.cobertura.xml" -targetdir:TestResults/coverage/report "-reporttypes:JsonSummary;MarkdownSummaryGithub"
          cat TestResults/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          dotnet run --file scripts/check-coverage.cs -- TestResults/coverage/report/Summary.json 90
      - name: Verify formatting
        run: dotnet format whitespace BackupZCrypt.sln --verify-no-changes --no-restore
