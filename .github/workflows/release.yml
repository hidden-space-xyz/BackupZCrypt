name: Desktop Release

on:
  workflow_call:

permissions:
  contents: read

env:
  DESKTOP_PROJECT: BackupZCrypt.Desktop/BackupZCrypt.Desktop.csproj

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.meta.outputs.changed }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      previous: ${{ steps.meta.outputs.previous }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Resolve release version
        id: meta
        run: node .github/scripts/release-version.mjs

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: osx-x64
            archive: tar.gz
          - rid: osx-arm64
            archive: tar.gz
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single-file application
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.version.outputs.version }}
        run: >-
          dotnet publish "$DESKTOP_PROJECT"
          --configuration Release
          --runtime "$RID"
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:ContinuousIntegrationBuild=true
          -p:Version="$VERSION"
      - name: Package portable application
        env:
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          name="BackupZCrypt-${TAG}-${RID}"
          mkdir -p "staging/${name}" artifacts
          cp -R publish/. "staging/${name}/"
          cp LICENSE README.md "staging/${name}/"
          rm -f "staging/${name}"/*.pdb
          if [ "$ARCHIVE" = "zip" ]; then
            (cd staging && zip -q -r -X "../artifacts/${name}.zip" "$name")
          else
            chmod +x "staging/${name}/BackupZCrypt"
            tar --owner=0 --group=0 -czf "artifacts/${name}.tar.gz" -C staging "$name"
          fi
      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Recheck version before publishing the release
        id: current
        run: node .github/scripts/release-version.mjs
      - name: Verify the prepared version is still current
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: test "$CURRENT_VERSION" = "$VERSION"
      - name: Download portable packages
        if: steps.current.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          merge-multiple: true
          path: assets
      - name: Create GitHub release
        if: steps.current.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(assets/*.zip assets/*.tar.gz)
          if [ "${#packages[@]}" -ne 4 ]; then
            echo "::error::Expected four release packages, found ${#packages[@]}."
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          ## Portable downloads

          | Platform | Asset |
          | --- | --- |
          | Windows x64 | \`BackupZCrypt-${RELEASE_TAG}-win-x64.zip\` |
          | Linux x64 | \`BackupZCrypt-${RELEASE_TAG}-linux-x64.tar.gz\` |
          | macOS Intel | \`BackupZCrypt-${RELEASE_TAG}-osx-x64.tar.gz\` |
          | macOS Apple Silicon | \`BackupZCrypt-${RELEASE_TAG}-osx-arm64.tar.gz\` |

          Every package is a self-contained single-file build; no .NET runtime is required.
          On Linux and macOS, run \`chmod +x BackupZCrypt\` after extracting.
          EOF
          args=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --title "BackupZCrypt $RELEASE_TAG" --generate-notes \
            --notes-file "$notes" "${args[@]}" "${packages[@]}"
