name: CodeQL

on:
  push:
    branches: [develop, master]
    paths:
      - BackupZCrypt.*/**
      - BackupZCrypt.sln
      - Directory.Build.props
      - Directory.Build.targets
      - Directory.Packages.props
      - global.json
      - .github/workflows/codeql.yml

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - name: Restore and compile application under CodeQL tracing
        if: matrix.language == 'csharp'
        run: |
          dotnet restore BackupZCrypt.sln
          dotnet build BackupZCrypt.sln --configuration Release --no-restore --no-incremental -p:UseSharedCompilation=false
      - name: Analyze code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never
      - name: Drop results in build output
        working-directory: ${{ runner.temp }}/codeql-results
        run: |
          for sarif in *.sarif; do
            jq '.runs[].results |= map(select(.locations[0].physicalLocation.artifactLocation.uri // "" | test("(^|/)(obj|bin)/") | not))' "$sarif" > "$sarif.filtered"
            mv "$sarif.filtered" "$sarif"
          done
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}
      - name: Upload SARIF report
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          retention-days: 7
