name: CodeQL

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js for the security gate
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - name: Restore and compile application under CodeQL tracing
        if: matrix.language == 'csharp'
        run: |
          dotnet restore BackupZCrypt.sln
          dotnet build BackupZCrypt.sln --configuration Release --no-restore --no-incremental -p:UseSharedCompilation=false
      - name: Analyze code
        uses: github/codeql-action/analyze@v4
        id: analyze
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          wait-for-processing: true
      - name: Block releases on high, critical or error findings
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: node .github/scripts/check-codeql.mjs "$SARIF_DIRECTORY"
      - name: Preserve CodeQL diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
